name: Continuous integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm --filter @scentiq/web test

      - name: Lint frontend
        run: pnpm --filter @scentiq/web lint

      - name: Type-check frontend
        run: pnpm --filter @scentiq/web typecheck

      - name: Build frontend
        run: pnpm --filter @scentiq/web build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCENTIQ_ENV: test
      DATABASE_URL: postgresql+psycopg://scentiq_ci:scentiq_ci_only@localhost:5432/scentiq_ci
      CORS_ORIGINS: http://localhost:3000
    services:
      postgres:
        image: postgres@sha256:a10c981235b4f635e65df0cfb66a5598064628128505dbc6a3ed4ca303717521
        env:
          POSTGRES_DB: scentiq_ci
          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256
          POSTGRES_USER: scentiq_ci
          POSTGRES_PASSWORD: scentiq_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scentiq_ci -d scentiq_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install locked dependencies
        run: uv sync --directory apps/api --frozen --all-groups

      - name: Run backend unit tests
        run: uv run --directory apps/api pytest -m "not integration"

      - name: Run PostgreSQL integration tests
        run: uv run --directory apps/api pytest -m integration

      - name: Lint and format-check backend
        run: |
          uv run --directory apps/api ruff check .
          uv run --directory apps/api ruff format --check .

      - name: Type-check backend
        run: uv run --directory apps/api mypy src tests

      - name: Verify full migration cycle
        run: |
          uv run --directory apps/api alembic upgrade head
          uv run --directory apps/api alembic current --check-heads
          uv run --directory apps/api alembic downgrade base
          uv run --directory apps/api alembic upgrade head
          uv run --directory apps/api alembic current --check-heads
          uv run --directory apps/api alembic check

  containers:
    name: Containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build production images
        run: docker compose --env-file .env.example build --pull api web

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compile Bicep templates
        run: |
          az bicep build --file infra/main.bicep --outfile /tmp/scentiq-main.json
          az bicep build-params --file infra/parameters/dev.bicepparam --outfile /tmp/scentiq-dev.json

      - name: Verify compiled infrastructure safety
        run: pwsh -File infra/tests/Test-CompiledInfrastructure.ps1 -TemplatePath /tmp/scentiq-main.json -Mode dev

      - name: Verify repository privacy
        run: pwsh -File scripts/ci/Test-RepositoryPrivacy.ps1 -RepositoryRoot . -Scope tracked
