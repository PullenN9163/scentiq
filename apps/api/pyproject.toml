[project]
name = "scentiq-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.19,<1.20",
  "azure-monitor-opentelemetry>=1.8,<1.9",
  "fastapi[standard]>=0.141,<0.142",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic-settings>=2.15,<2.16",
  "sqlalchemy>=2.0.51,<2.1",
]

[dependency-groups]
dev = [
  "httpx2>=2.7,<2.8",
  "mypy>=2.3,<2.4",
  "pytest>=9.1,<9.2",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scentiq_api"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "integration: marks tests that require integration dependencies",
]
